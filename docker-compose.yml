# Запуск приложения: docker compose up --build
# Локальная модель считается отдельно, на дискретной видеокарте NVIDIA:
# llama-server на хосте, адрес LOCAL_LLM_BASE_URL.
# Расчёт на процессоре и на встроенной графике не используем.
services:
  app:
    build: .
    ports:
      - '8000:8000'
    environment:
      LLM_MODE: ${LLM_MODE:-mock}
      ALLOW_CLOUD: ${ALLOW_CLOUD:-false}
      LOCAL_LLM_BASE_URL: ${LOCAL_LLM_BASE_URL:-http://host.docker.internal:8080/v1}
      CASE_LLM_BASE_URL: ${CASE_LLM_BASE_URL:-}
      CASE_LLM_API_KEY: ${CASE_LLM_API_KEY:-}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      DEMO_MODE: ${DEMO_MODE:-true}
      CASE_DATA_DIR: /srv/input/company_profile
      BANK_PDF_DIR: /srv/input/bank_analytics
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - ./data:/srv/data
      - ./config:/srv/config
      - ../DATA/company_profile:/srv/input/company_profile:ro
      - ../DATA/bank_analytics:/srv/input/bank_analytics:ro
