# Типы событий. Новый тип добавляется записью, код не меняется.
event_types:
  monetary_policy:
    title: Денежно-кредитная политика
    triggers: ['ключевая ставка', 'ставк', 'совет директоров банка россии', 'денежно-кредитн']
    exposures: [rate_borrower, rate_saver]
    weight: 1.0
    bank_topics: [key_rate, tactical_q3, bond_brief]
  inflation_macro:
    title: Инфляция и макростатистика
    triggers: ['инфляц', 'ввп', 'росстат', 'макростатистик']
    exposures: [rate_borrower, rate_saver, consumption]
    weight: 0.8
    bank_topics: [inflation, macro_7m26, macro_1h26]
  fx:
    title: Валютный рынок
    triggers: ['курс рубля', 'юан', 'доллар', 'валютн']
    exposures: [fx_exposure]
    weight: 0.9
    bank_topics: [tactical_q3]
  commodities_energy:
    title: Сырьё и энергоносители
    triggers: ['нефть', 'brent', 'urals', 'газ', 'уголь', 'сырь']
    exposures: [commodity_energy, commodity_metals]
    weight: 0.8
    bank_topics: [commodities]
  precious_metals:
    title: Драгоценные металлы
    triggers: ['золот', 'серебр', 'платин', 'палладий']
    exposures: [commodity_precious]
    weight: 0.8
    bank_topics: [gold]
  regulation_tax:
    title: Регулирование и налоги
    triggers: ['налог', 'закон', 'постановление', 'пошлин', 'регулир']
    exposures: [sector_regulation]
    weight: 0.7
    bank_topics: []
  sanctions_trade:
    title: Санкции и торговые ограничения
    triggers: ['санкци', 'экспорт', 'импорт', 'тариф', 'ограничени']
    exposures: [fx_exposure, country_exposure]
    weight: 0.8
    bank_topics: []
  consumption_labor:
    title: Рынок труда и потребление
    triggers: ['рынок труда', 'безработиц', 'потреблен', 'зарплат']
    exposures: [consumption]
    weight: 0.6
    bank_topics: [consumption_peak, macro_7m26]
  counterparty:
    title: События контрагентов
    triggers: []
    exposures: [counterparty]
    weight: 1.0
    bank_topics: []
