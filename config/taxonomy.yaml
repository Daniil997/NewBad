    weight: 0.8
    bank_topics: []
  counterparty:
    title: События контрагентов
    priority: 40
    triggers: []
    exposures: [counterparty]
    weight: 1.0
    bank_topics: []
  unknown:
    title: Неизвестно/неоднозначно
    priority: 0
