# Типы событий. Новый тип добавляется записью, код не меняется.
# Классификация:
# 1. Точный триггер — свидетельство категории. Один общий триггер не считается: нужны два общих.
# 2. Побеждает категория с большим числом точных триггеров. Приоритет этот перевес не перекрывает.
# 3. Одинаковое число точных триггеров у двух категорий — «неизвестно/неоднозначно», даже если приоритеты разные.
# 4. Нет свидетельств — та же категория, а не догадка.
# Приоритет — насколько категория конкретна (0–99). Это не вес в ленте.
classification:
  unknown: unknown
  min_broad_hits: 2

event_types:
  monetary_policy:
    title: Ключевая ставка и денежно-кредитная политика
    priority: 90
    triggers:
      - {all: [ключев, ставк]}
      - {phrase: денежно-кредитн}
      - {phrase: совет директоров банка россии}
      - {phrase: ставк, broad: true}
    exposures: [rate_borrower, rate_saver]
    weight: 1.0
    bank_topics: [key_rate, tactical_q3, bond_brief]
  bonds:
    title: Облигации
    priority: 80
    triggers:
      - {phrase: облигац}
      - {phrase: офз}
      - {phrase: бонд}
    exposures: [rate_borrower, rate_saver]
    weight: 0.8
    bank_topics: [bonds]
  inflation_macro:
    title: Инфляция
    priority: 60
    triggers:
      - {phrase: инфляц}
      - {phrase: ипц}
      - {phrase: потребительские цены}
      - {phrase: потребительских цен}
    exposures: [rate_borrower, rate_saver, consumption]
    weight: 0.8
    bank_topics: [inflation]
  macro:
    title: Макроэкономика
    priority: 60
    triggers:
      - {phrase: ввп}
      - {phrase: макростатистик}
      - {phrase: промпроизводств}
      - {phrase: промышленное производство}
    exposures: [rate_borrower, rate_saver, consumption]
    weight: 0.7
    bank_topics: [macro]
  fx:
    title: Валютный рынок
    priority: 70
    triggers:
      - {phrase: курс рубля}
      - {phrase: юан}
      - {phrase: доллар}
      - {phrase: валютн}
    exposures: [fx_exposure]
    weight: 0.9
    bank_topics: [tactical_q3]
  commodities_energy:
    title: Сырьё и энергоносители
    priority: 70
    triggers:
      - {phrase: нефть}
      - {phrase: brent}
      - {phrase: urals}
      - {phrase: газ}
      - {phrase: угл}
      - {phrase: сырь, broad: true}
    exposures: [commodity_energy, commodity_metals]
    weight: 0.8
    bank_topics: [commodities]
  metals:
    title: Металлы
    priority: 80
    triggers:
      - {phrase: сталь}
      - {phrase: стальн}
      - {phrase: алюмини}
      - {phrase: никел}
      - {phrase: медь}
      - {phrase: медн}
      - {phrase: металлург}
    exposures: [commodity_metals]
    weight: 0.8
    bank_topics: [metals]
  precious_metals:
    title: Драгоценные металлы
    priority: 80
    triggers:
      - {phrase: золот}
      - {phrase: серебр}
      - {phrase: платин}
      - {phrase: палладий}
    exposures: [commodity_precious]
    weight: 0.8
    bank_topics: [gold]
  consumption_labor:
    title: Потребление и рынок труда
    priority: 50
