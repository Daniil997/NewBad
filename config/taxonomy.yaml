    bank_topics: [consumption]
  regulation_tax:
    title: Регулирование и налоги
    priority: 50
    triggers:
      - {phrase: налог}
      - {phrase: пошлин}
      - {phrase: регулир}
      - {phrase: постановлен}
      - {phrase: закон, broad: true}
    exposures: [sector_regulation]
    weight: 0.7
    bank_topics: []
  sanctions_trade:
    title: Санкции и торговые ограничения
    priority: 50
    triggers:
      - {phrase: санкци}
      - {phrase: экспорт}
      - {phrase: импорт}
      - {phrase: тариф}
      - {phrase: ограничени, broad: true}
