# Единственный источник рыночных данных: ISS Московской биржи.
# Бесплатные данные могут поступать с задержкой; приложение это явно показывает.
provider: moex_iss
base_url: https://iss.moex.com/iss
timeout_s: 15
max_response_bytes: 5242880
categories:
  currencies:
    engine: currency
    market: selt
    board: CETS
    instruments:
      - USD000UTSTOM
      - EUR_RUB__TOM
      - CNYRUB_TOM
  equities:
    engine: stock
    market: shares
    board: TQBR
    instruments:
      - SBER
      - GAZP
      - LKOH
      - ROSN
      - NVTK
      - GMKN
      - YDEX
      - VTBR
  metals:
    engine: currency
    market: selt
    board: CETS
    instruments:
      - GLDRUB_TOM
      - SLVRUB_TOM
      - PLDRUB_TOM
      - PLTRUB_TOM
