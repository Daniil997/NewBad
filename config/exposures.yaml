# Экспозиция включается только явным условием. Пустой флаг и значение «нет» её не создают.
# basis: confirmed — поле выгрузки или платёж; hypothesis — тема ОКВЭД, не факт о продукте.
# source — откуда условие. confidence — насколько прямо оно подтверждено, не вес в ленте.
# Валютная позиция не выводится из ФТС: в выгрузке нет доли валютной выручки.
exposures:
  rate_borrower:
    title: Заёмное финансирование
    basis: confirmed
    source: bank_data
    confidence: high
    when: {any_flag: [CL_PRODUCT_LOA_MARK, CL_PRODUCT_LEA_MARK]}
    strength: 0.9
    assumptions:
      - 'Тип процентной ставки по кредитам неизвестен: не утверждаем, что она плавающая.'
  rate_saver:
    title: Депозиты
    basis: confirmed
    source: bank_data
    confidence: high
    when: {any_flag: [CL_PRODUCT_DEP_MARK]}
    strength: 0.8
    assumptions:
      - 'Срок и ставка депозита неизвестны.'
  fx_exposure:
    title: Валютная позиция
    basis: confirmed
    source: client_input
    confidence: high
    when: {feature_present: [FX_REVENUE_SHARE]}
    strength: 0.8
    assumptions:
      - 'Валютная позиция есть только если доля валютной выручки указана. Признак ФТС её не заменяет.'
  foreign_trade:
    title: Импорт и экспорт
    basis: confirmed
    source: bank_data
    confidence: high
    when: {any_flag: [FTS_FLAG]}
    strength: 0.8
    assumptions:
      - 'Признак ФТС подтверждает внешнюю торговлю, но не валюту расчётов и не долю экспорта.'
  country_exposure:
    title: Страна внешней торговли
    basis: confirmed
    source: bank_data
    confidence: high
    when: {feature_present: [FTS_COUNTRY_NAME]}
    strength: 0.7
    assumptions:
      - 'Страна из данных ФТС не называет валюту контракта.'
  commodity_energy:
    title: Энергия
    basis: hypothesis
    source: derived
    confidence: medium
    when: {derived_theme: [energy]}
    strength: 0.7
    assumptions:
      - 'Тема энергии взята из ОКВЭД. Добыча, переработка или торговля топливом отдельно не подтверждены.'
  commodity_metals:
    title: Металлы
    basis: hypothesis
    source: derived
    confidence: medium
    when: {derived_theme: [metals]}
    strength: 0.7
    assumptions:
      - 'Тема металлов взята из ОКВЭД. Выпуск или торговля металлом отдельно не подтверждены.'
  commodity_precious:
    title: Драгоценные металлы
    basis: hypothesis
    source: derived
    confidence: medium
    when: {derived_theme: [precious_metals]}
    strength: 0.7
    assumptions:
      - 'Тема драгоценных металлов взята из ОКВЭД. Добыча или производство отдельно не подтверждены.'
  consumption:
    title: Потребление
    basis: hypothesis
    source: derived
    confidence: medium
    when: {derived_theme: [trade, food]}
    strength: 0.5
    assumptions:
      - 'Связь с потреблением взята из ОКВЭД торговли или продуктов питания.'
  sector_regulation:
    title: Регулирование
    basis: hypothesis
    source: derived
    confidence: low
    when: {feature_present: [MAINOKVED_CODE]}
    strength: 0.4
    assumptions:
      - 'Код ОКВЭД не называет конкретный регуляторный режим.'
  liquidity_factoring:
    title: Факторинг
    basis: confirmed
    source: bank_data
    confidence: high
    when: {any_flag: [FACTORING_MARK]}
    strength: 0.5
    assumptions:
      - 'Объём факторинга в выгрузке не указан.'
  counterparty:
    title: Контрагенты
    basis: confirmed
    source: payments
    confidence: high
    when: {derived: counterparty_match}
    strength: 0.9
    assumptions: []
